[project]
name = "helix-finance-ai"
version = "0.1.0"
description = "AI Financial Operations Platform — Multi-Agent RAG for FinTech"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # ── API & Web ──────────────────────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",         # file upload support

    # ── Config & Validation ────────────────────────────────────────────────
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.1.0",

    # ── Security ───────────────────────────────────────────────────────────
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # ── Database ───────────────────────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # ── Cache ──────────────────────────────────────────────────────────────────
    "redis>=5.0.0",

    # ── Vector DB ──────────────────────────────────────────────────────────
    "qdrant-client>=1.9.0",

    # ── Object Storage ─────────────────────────────────────────────────────
    "minio>=7.2.7",

    # ── Message Queue / Workers ────────────────────────────────────────────────
    "celery>=5.4.0",
    "kombu>=5.3.0",
    "amqp>=5.2.0",

    # ── LLM / Agent Framework ─────────────────────────────────────────────
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "litellm>=1.40.0",

    # ── Observability ──────────────────────────────────────────────────────
    "prometheus-client>=0.20.0",
    "langfuse>=2.30.0",

    # ── Evaluation ─────────────────────────────────────────────────────────
    "ragas>=0.1.9",
    "deepeval>=1.0.0",

    # ── Utilities ──────────────────────────────────────────────────────────
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps", "agents", "rag", "security", "evaluation", "observability", "infrastructure", "workers"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
