<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helix Finance AI - Test Console</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 28, 45, 0.4);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #4f46e5;
            --primary-glow: rgba(79, 70, 229, 0.4);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(79, 70, 229, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 40%);
        }

        header {
            width: 100%;
            max-width: 1200px;
            padding: 2rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 2rem 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card:hover {
            border-color: rgba(79, 70, 229, 0.25);
            box-shadow: 0 12px 40px rgba(79, 70, 229, 0.1);
        }

        .auth-container {
            max-width: 480px;
            margin: 4rem auto;
            width: 100%;
        }

        .form-group {
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        input[type="email"], input[type="password"] {
            background: rgba(17, 24, 39, 0.5);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="email"]:focus, input[type="password"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px var(--primary-glow);
        }

        .btn {
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background: #4338ca;
            transform: translateY(-1px);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-logout {
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
        }

        .btn-logout:hover {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
            border-color: rgba(239, 68, 68, 0.2);
        }

        .alert-info {
            background: rgba(79, 70, 229, 0.1);
            border: 1px solid rgba(79, 70, 229, 0.2);
            color: #a5b4fc;
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .drop-zone {
            border: 2px dashed rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            background: rgba(255, 255, 255, 0.02);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--primary);
            background: rgba(79, 70, 229, 0.05);
        }

        .drop-zone svg {
            width: 48px;
            height: 48px;
            color: var(--text-secondary);
            transition: color 0.2s;
        }

        .drop-zone:hover svg {
            color: var(--primary);
        }

        .hidden {
            display: none !important;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: 1fr 2fr;
            }
        }

        /* Status badges */
        .badge {
            display: inline-flex;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-pending {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
        }

        .badge-processing {
            background: rgba(79, 70, 229, 0.15);
            color: #a5b4fc;
        }

        .badge-indexed {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
        }

        .badge-failed {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            margin-top: 1rem;
        }

        th, td {
            padding: 1rem;
            border-bottom: 1px solid var(--card-border);
        }

        th {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        td {
            font-size: 0.95rem;
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.01);
        }

        .spinner {
            animation: rotate 2s linear infinite;
            width: 20px;
            height: 20px;
        }

        .spinner .path {
            stroke: #fff;
            stroke-linecap: round;
            animation: dash 1.5s ease-in-out infinite;
        }

        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }

        @keyframes dash {
            0% { stroke-dasharray: 1, 150; stroke-dashoffset: 0; }
            50% { stroke-dasharray: 90, 150; stroke-dashoffset: -35; }
            100% { stroke-dasharray: 90, 150; stroke-dashoffset: -124; }
        }
    </style>
</head>
<body>
    <header>
        <h1>🏦 Helix Finance AI <span style="font-size: 0.9rem; font-weight: 400; color: var(--text-secondary);">Test Console</span></h1>
        <div id="user-profile" class="hidden" style="display: flex; align-items: center; gap: 1rem;">
            <span id="user-email" style="font-size: 0.9rem; color: var(--text-secondary);"></span>
            <button class="btn btn-logout" onclick="logout()">Logout</button>
        </div>
    </header>

    <div class="container">
        <!-- Auth Section -->
        <div id="auth-section" class="card auth-container">
            <h2 style="margin-bottom: 1.5rem; font-family: 'Outfit';">Sign In</h2>
            <div class="alert-info">
                <strong>Dev Credentials:</strong><br>
                Email: <code>admin@helix.ai</code><br>
                Password: <code>admin123</code>
            </div>
            <form id="login-form" onsubmit="login(event)">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="admin@helix.ai">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn" style="width: 100%;">
                    <span>Sign In</span>
                </button>
            </form>
        </div>

        <!-- Main Dashboard Section -->
        <div id="main-section" class="grid hidden">
            <!-- Sidebar: File Uploader -->
            <div class="card" style="align-self: start;">
                <h3 style="margin-bottom: 1.5rem; font-family: 'Outfit';">Upload Documents</h3>
                <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                    </svg>
                    <div>
                        <p style="font-weight: 600;">Drag & drop your files here</p>
                        <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.25rem;">Supports PDF, DOCX, TXT</p>
                    </div>
                    <input type="file" id="file-input" class="hidden" accept=".pdf,.docx,.txt" onchange="handleFileSelect(event)">
                </div>
                <div id="upload-status" style="margin-top: 1.5rem; font-size: 0.9rem; display: none;"></div>
            </div>

            <!-- Main Content: Document List -->
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <h3 style="font-family: 'Outfit';">Document Ingestion Pipeline</h3>
                    <button class="btn btn-logout" onclick="loadDocuments()" style="padding: 0.5rem 1rem; font-size: 0.875rem;">Refresh</button>
                </div>
                <div style="overflow-x: auto;">
                    <table>
                        <thead>
                            <tr>
                                <th>Filename</th>
                                <th>Size</th>
                                <th>Status</th>
                                <th>Chunks</th>
                                <th>Task ID</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="documents-tbody">
                            <tr>
                                <td colspan="6" style="text-align: center; color: var(--text-secondary); padding: 3rem;">No documents uploaded yet.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        let token = localStorage.getItem('token') || '';

        document.addEventListener('DOMContentLoaded', () => {
            if (token) {
                showDashboard();
            } else {
                showAuth();
            }

            // Drag and drop events
            const dropZone = document.getElementById('drop-zone');
            ['dragenter', 'dragover'].forEach(eventName => {
                dropZone.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    dropZone.classList.add('dragover');
                }, false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    dropZone.classList.remove('dragover');
                }, false);
            });

            dropZone.addEventListener('drop', (e) => {
                const dt = e.dataTransfer;
                const files = dt.files;
                if (files.length > 0) {
                    uploadFile(files[0]);
                }
            });
        });

        function showAuth() {
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('main-section').classList.add('hidden');
            document.getElementById('user-profile').classList.add('hidden');
        }

        function showDashboard() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('main-section').classList.remove('hidden');
            document.getElementById('user-profile').classList.remove('hidden');
            
            // Decrypt dummy/payload info or fetch user
            fetch('/api/v1/auth/me', {
                headers: { 'Authorization': `Bearer ${token}` }
            })
            .then(res => {
                if (res.status === 401) {
                    logout();
                    return;
                }
                return res.json();
            })
            .then(data => {
                if (data) {
                    document.getElementById('user-email').innerText = data.email;
                }
            });

            loadDocuments();
            // Start polling documents status
            if (window.pollInterval) clearInterval(window.pollInterval);
            window.pollInterval = setInterval(loadDocuments, 3000);
        }

        async function login(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                if (!response.ok) {
                    const err = await response.json();
                    alert(err.detail || 'Authentication failed');
                    return;
                }
                
                const data = await response.json();
                token = data.access_token;
                localStorage.setItem('token', token);
                showDashboard();
            } catch (err) {
                alert('Connection error');
            }
        }

        function logout() {
            token = '';
            localStorage.removeItem('token');
            if (window.pollInterval) clearInterval(window.pollInterval);
            showAuth();
        }

        function handleFileSelect(e) {
            const files = e.target.files;
            if (files.length > 0) {
                uploadFile(files[0]);
            }
        }

        async function uploadFile(file) {
            const statusDiv = document.getElementById('upload-status');
            statusDiv.style.display = 'block';
            statusDiv.innerHTML = `<span style="color: var(--text-secondary)">Uploading ${file.name}...</span>`;
            
            const formData = new FormData();
            formData.append('file', file);
            
            try {
                const response = await fetch('/api/v1/documents/upload', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });
                
                if (!response.ok) {
                    const err = await response.json();
                    statusDiv.innerHTML = `<span style="color: var(--danger)">Upload failed: ${err.detail || 'Unknown error'}</span>`;
                    return;
                }
                
                const data = await response.json();
                statusDiv.innerHTML = `<span style="color: var(--success)">Successfully uploaded! Ingestion queued.</span>`;
                loadDocuments();
            } catch (err) {
                statusDiv.innerHTML = `<span style="color: var(--danger)">Connection error</span>`;
            }
        }

        async function loadDocuments() {
            if (!token) return;
            try {
                const response = await fetch('/api/v1/documents?page=1&page_size=50', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) return;
                
                const data = await response.json();
                const tbody = document.getElementById('documents-tbody');
                
                if (data.documents.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--text-secondary); padding: 3rem;">No documents uploaded yet.</td></tr>`;
                    return;
                }
                
                tbody.innerHTML = data.documents.map(doc => {
                    const sizeKB = (doc.size_bytes / 1024).toFixed(1) + ' KB';
                    const chunks = doc.chunk_count !== null ? doc.chunk_count : '—';
                    const taskId = doc.metadata.object_name ? doc.metadata.object_name.split('.')[0] : '—';
                    
                    return `
                        <tr>
                            <td style="font-weight: 600;">${escapeHtml(doc.filename)}</td>
                            <td>${sizeKB}</td>
                            <td><span class="badge badge-${doc.status}">${doc.status}</span></td>
                            <td>${chunks}</td>
                            <td style="font-family: monospace; font-size: 0.8rem; color: var(--text-secondary);">${escapeHtml(taskId)}</td>
                            <td>
                                <button class="btn btn-logout" onclick="deleteDoc('${doc.document_id}')" style="padding: 0.25rem 0.5rem; font-size: 0.75rem; border-color: rgba(239, 68, 68, 0.2); color: var(--danger);">Delete</button>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (err) {
                console.error('Error fetching documents:', err);
            }
        }

        async function deleteDoc(docId) {
            if (!confirm('Are you sure you want to delete this document?')) return;
            try {
                const response = await fetch(`/api/v1/documents/${docId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    loadDocuments();
                } else {
                    alert('Failed to delete document');
                }
            } catch (err) {
                alert('Connection error');
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
